name: CI

on:
  push:
    branches:
      - 'rc/**'
      - stable
  pull_request:
    branches:
      - 'rc/**'
      - stable

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Clean untracked files
        run: git clean -fdx
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache pnpm store
        uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Install dependencies
        run: pnpm install
      - name: Check
        run: pnpm check